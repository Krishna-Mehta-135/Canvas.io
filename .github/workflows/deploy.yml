name: Deploy Canvas

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. CI ─────────────────────────────────────────────────────────────────────
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db db:generate   # explicit Prisma gen — no postinstall hooks
      - run: pnpm run ci                           # lint + check-types + test

  # ── 2. Build & push images ────────────────────────────────────────────────────
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write   # push to GHCR

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: canvas-http-backend
            dockerfile: apps/http-backend/Dockerfile
          - service: canvas-ws-backend
            dockerfile: apps/ws-backend/Dockerfile
          - service: canvas-ai-worker
            dockerfile: apps/ai-worker/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ── 3a. Deploy API services → App VMs (e2-small × 2) ─────────────────────────
  deploy-apps:
    name: Deploy API/WS to ${{ matrix.vm_ip }}
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        vm_ip:
          - ${{ secrets.VM_1_IP }}
          - ${{ secrets.VM_2_IP }}

    steps:
      - name: SSH deploy to App VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ matrix.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/canvas

            # Pull the latest images from GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.prod.yml pull http-backend ws-backend

            # Zero-downtime rolling update of API services only
            docker compose -f docker-compose.prod.yml up -d \
              --no-deps \
              --remove-orphans \
              http-backend ws-backend

            docker image prune -f

  # ── 3b. Deploy AI Worker → Worker VM (e2-micro) ───────────────────────────────
  deploy-worker:
    name: Deploy AI Worker to Worker VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH deploy to Worker VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WORKER_VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/canvas

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull only the ai-worker image (RabbitMQ container is always-running infra)
            docker compose -f docker-compose.prod.yml pull ai-worker

            # Update the ai-worker; leave rabbitmq untouched
            docker compose -f docker-compose.prod.yml up -d \
              --no-deps \
              ai-worker

            docker image prune -f