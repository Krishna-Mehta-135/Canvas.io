name: Deploy Canvas

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.30.1
  NODE_VERSION: 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. CI STAGE (Fail Fast) ──────────────────────────────────────────────────
  ci:
    name: Continuous Integration
    uses: ./.github/workflows/ci.yml

  # ── 2. BUILD STAGE (Dockerize & Push) ────────────────────────────────────────
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ci] # Only build if all CI checks pass
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: canvas-http-backend
            dockerfile: apps/http-backend/Dockerfile
          - service: canvas-ws-backend
            dockerfile: apps/ws-backend/Dockerfile
          - service: canvas-ai-worker
            dockerfile: apps/ai-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Derive lowercase image name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runner
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.service }}:sha-${{ github.sha }}
          # 🚨 Bakes production URLs into the Next.js bundle
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ── 3a. DEPLOY APPS → VM 1 & 2 (App Nodes) ──────────────────────────────────
  deploy-apps:
    name: Deploy API/WS to ${{ matrix.vm_ip }}
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        vm_ip: [ "${{ vars.VM_1_IP }}", "${{ vars.VM_2_IP }}" ]
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy docker-compose file to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ matrix.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/canvas"

      - name: SSH deploy to App VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ matrix.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /opt/canvas && cd /opt/canvas

            # 🚨 Fix 1: Force lowercase repo name for Docker images
            LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Inject all environment variables into a .env file on the VM
            cat <<EOF > .env
            NODE_ENV="production"
            GITHUB_REPO="$LOWER_REPO"
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            REDIS_URL="redis://10.190.0.4:6379"
            RABBITMQ_URL="amqp://${{ secrets.RABBITMQ_USER }}:${{ secrets.RABBITMQ_PASS }}@10.190.0.4:5672"
            RABBITMQ_USER="${{ secrets.RABBITMQ_USER }}"
            RABBITMQ_PASS="${{ secrets.RABBITMQ_PASS }}"
            JWT_SECRET="${{ secrets.JWT_SECRET }}"
            INTERNAL_SECRET="${{ secrets.INTERNAL_SECRET }}"
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            GEMINI_MODEL_CANDIDATES="${{ secrets.GEMINI_MODEL_CANDIDATES }}"
            GMAIL_USER="${{ secrets.GMAIL_USER }}"
            GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD }}"
            WEB_APP_URL="${{ secrets.WEB_APP_URL }}"
            NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
            NEXT_PUBLIC_WS_URL="${{ secrets.NEXT_PUBLIC_WS_URL }}"
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull http-backend ws-backend
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans http-backend ws-backend
            docker image prune -f

  # ── 3b. DEPLOY WORKER → VM 3 (Infra/Worker Node) ────────────────────────────
  deploy-worker:
    name: Deploy AI Worker to Worker VM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose file to Worker VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.WORKER_VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/canvas"

      - name: SSH deploy to Worker VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.WORKER_VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /opt/canvas && cd /opt/canvas

            # 🚨 Fix 1: Force lowercase repo name for Docker images
            LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Worker VM only needs infrastructure connection secrets
            cat <<EOF > .env
            NODE_ENV="production"
            GITHUB_REPO="$LOWER_REPO"
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            REDIS_URL="redis://10.190.0.4:6379"
            RABBITMQ_URL="amqp://${{ secrets.RABBITMQ_USER }}:${{ secrets.RABBITMQ_PASS }}@10.190.0.4:5672"
            RABBITMQ_USER="${{ secrets.RABBITMQ_USER }}"
            RABBITMQ_PASS="${{ secrets.RABBITMQ_PASS }}"
            JWT_SECRET="${{ secrets.JWT_SECRET }}"
            INTERNAL_SECRET="${{ secrets.INTERNAL_SECRET }}"
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            HTTP_BACKEND_INTERNAL_URL="${{ secrets.HTTP_BACKEND_INTERNAL_URL }}"
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull ai-worker
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans ai-worker
            docker image prune -f